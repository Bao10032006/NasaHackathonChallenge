services:
  - type: web
    name: hoalich-backend
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/metadata
    envVars:
      - key: HOALICH_ALLOWED_ORIGINS
        value: "https://hoa-lich.vercel.app,https://hoalichvn.me,https://www.hoalichvn.me"
