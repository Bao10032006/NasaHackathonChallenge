  responses:
    InvalidParameter:
      description: Invalid primitive value, bounds, or spatial/temporal selector combination
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          examples:
            invalidParameter:
              value: {type: 'https://hoalich.local/problems/invalid-parameter', title: Invalid parameter, status: 400, code: INVALID_PARAMETER, detail: month must be between 1 and 12, instance: /api/v1/calendar/days, timestamp: '2026-11-14T10:00:00Z'}
            invalidSpatialSelector:
              value: {type: 'https://hoalich.local/problems/invalid-spatial-selector', title: Invalid spatial selector, status: 400, code: INVALID_SPATIAL_SELECTOR, detail: Supply areaType and areaId or all four bbox coordinates, instance: /api/v1/map/cells, timestamp: '2026-11-14T10:00:00Z'}
            invalidBounds:
              value: {type: 'https://hoalich.local/problems/invalid-bounds', title: Invalid bounds, status: 400, code: INVALID_BOUNDS, detail: west must be less than east, instance: /api/v1/map/cells, timestamp: '2026-11-14T10:00:00Z'}
            invalidTemporalSelector:
              value: {type: 'https://hoalich.local/problems/invalid-temporal-selector', title: Invalid temporal selector, status: 400, code: INVALID_TEMPORAL_SELECTOR, detail: Select exactly one of date, year, year plus month, or year plus pentad, instance: /api/v1/map/cells, timestamp: '2026-11-14T10:00:00Z'}
    AreaNotFound:
      description: Named area does not exist in the active snapshot
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    CellNotFound:
      description: Cell ID does not exist in the active snapshot
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    UnsupportedQuery:
      description: Valid syntax but unsupported query, empty bbox, or exact date outside the dataset
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          examples:
            noCellsInBounds:
              value: {type: 'https://hoalich.local/problems/no-cells-in-bounds', title: No cells in bounds, status: 422, code: NO_CELLS_IN_BOUNDS, detail: The bounding box contains no dataset cell centers, instance: /api/v1/map/cells, timestamp: '2026-11-14T10:00:00Z'}
            unsupportedQuery:
              value: {type: 'https://hoalich.local/problems/unsupported-query', title: Unsupported query, status: 422, code: UNSUPPORTED_QUERY, detail: This valid query is not supported by the active capability set, instance: /api/v1/trends, timestamp: '2026-11-14T10:00:00Z'}
            dateOutsideDatasetRange:
              value: {type: 'https://hoalich.local/problems/date-outside-dataset-range', title: Date outside dataset range, status: 422, code: DATE_OUTSIDE_DATASET_RANGE, detail: date must be between 2000-11-01 and 2026-11-13, instance: /api/v1/daily, timestamp: '2026-11-14T10:00:00Z'}
    DatasetUnavailable:
      description: Required dataset artifact is unavailable or invalid
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    InternalError:
      description: Unexpected server error
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
  schemas:
    AreaType:
      type: string
      enum: [national, diagnostic_region, cell]
    SelectionType:
      type: string
      enum: [NAMED_AREA, BOUNDING_BOX]
    SelectionRule:
      type: string
      enum: [NAMED_AREA_MEMBERSHIP, CENTER_INCLUSIVE]
    CalendarGranularity:
      type: string
      enum: [month, pentad]
    ValueStatus:
      type: string
      enum: [AVAILABLE, MISSING, OUTSIDE_DATASET_RANGE, INSUFFICIENT_BASELINE]
      description: >-
        OUTSIDE_DATASET_RANGE applies to series items whose requested period has
        zero overlap with the dataset. Partial overlap remains AVAILABLE with
        coverage.partial=true. Exact-date endpoints return a 422 problem instead.
    Origin:
      type: string
      enum: [DIRECT_OBSERVATION, SCALED_OBSERVATION, MODEL_REDISTRIBUTED, MIXED]
    Source:
      type: string
      enum: [TERRA, AQUA, SNPP, NOAA20]
    Bounds:
      type: object
      additionalProperties: false
      required: [west, south, east, north]
      properties:
        west: {type: number, format: double}
        south: {type: number, format: double}
        east: {type: number, format: double}
        north: {type: number, format: double}
    Coordinates:
      type: object
      additionalProperties: false
      required: [lat, lon]
      properties:
        lat: {type: number, format: double}
        lon: {type: number, format: double}
    AreaRef:
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type: {$ref: '#/components/schemas/AreaType'}
        id: {type: string}
    SpatialSelection:
      type: object
      additionalProperties: false
      required: [type, selectionRule, selectedBounds, cellCount, cellIds]
      properties:
        type: {$ref: '#/components/schemas/SelectionType'}
        selectionRule: {$ref: '#/components/schemas/SelectionRule'}
        area: {$ref: '#/components/schemas/AreaRef'}
        requestedBounds: {$ref: '#/components/schemas/Bounds'}
        selectedBounds:
          allOf:
            - $ref: '#/components/schemas/Bounds'
          description: >-
            Smallest bbox covering the complete geometry of selected cells
            (min cell west/south, max cell east/north), not the center envelope.
        cellCount: {type: integer, minimum: 1, maximum: 587}
        cellIds:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string}
    Coverage:
      type: object
      additionalProperties: false
      required:
        - requestedStartDate
        - requestedEndDate
        - coveredStartDate
        - coveredEndDate
        - expectedDayCount
        - coveredDayCount
        - uncoveredDayCount
        - partial
      properties:
        requestedStartDate: {type: string, format: date}
        requestedEndDate: {type: string, format: date}
        coveredStartDate: {type: [string, 'null'], format: date}
        coveredEndDate: {type: [string, 'null'], format: date}
        expectedDayCount: {type: integer, minimum: 1}
        coveredDayCount: {type: integer, minimum: 0}
        uncoveredDayCount: {type: integer, minimum: 0}
        partial: {type: boolean}
    ResponseMeta:
      type: object
      additionalProperties: false
      required: [dataVersion, modelVersion, dataThrough, metric, unit, timeZone, warnings]
      properties:
        dataVersion: {type: string, example: hoalich-data-v1-2026-11-13}
        modelVersion: {type: string, example: lai-clim-s2-k60-kappa3}
        dataThrough: {type: string, format: date}
        metric: {type: string, const: snpp_eq}
        unit: {type: string, const: S-NPP-equivalent daytime detections}
        timeZone: {type: string, const: UTC}
        warnings:
          type: array
          items: {type: string}
    TemporalSelector:
      type: object
      additionalProperties: false
      required: [type, startDate, endDate, coverage]
      properties:
        type: {type: string, enum: [DATE, YEAR, MONTH, PENTAD]}
        date: {type: string, format: date}
        year: {type: integer}
        month: {type: integer, minimum: 1, maximum: 12}
        pentad: {type: integer, minimum: 1, maximum: 73}
        startDate: {type: string, format: date}
        endDate: {type: string, format: date}
        coverage: {$ref: '#/components/schemas/Coverage'}
    PeriodPeak:
      type: object
      additionalProperties: false
      required: [period, value]
      properties:
        period: {type: integer, minimum: 1, maximum: 73}
        value: {type: number, minimum: 0}
    DatePeak:
      type: object
      additionalProperties: false
      required: [date, value]
      properties:
        date: {type: string, format: date}
        value: {type: number, minimum: 0}
    CalendarSummary:
      type: object
      additionalProperties: false
      required: [totalValue, valueStatus, coverage, peakPeriod]
      properties:
        totalValue: {type: [number, 'null'], minimum: 0}
        valueStatus: {$ref: '#/components/schemas/ValueStatus'}
        coverage: {$ref: '#/components/schemas/Coverage'}
        peakPeriod:
          oneOf:
            - $ref: '#/components/schemas/PeriodPeak'
            - type: 'null'
    DailyCalendarSummary:
      type: object
      additionalProperties: false
      required: [totalValue, valueStatus, coverage, peakDate]
      properties:
        totalValue: {type: [number, 'null'], minimum: 0}
        valueStatus: {$ref: '#/components/schemas/ValueStatus'}
        coverage: {$ref: '#/components/schemas/Coverage'}
        peakDate:
          oneOf:
            - $ref: '#/components/schemas/DatePeak'
            - type: 'null'
    MapSummary:
      type: object
      additionalProperties: false
      required: [totalValue, valueStatus, origin, coverage, minCellValue, maxCellValue]
      properties:
        totalValue: {type: [number, 'null'], minimum: 0}
        valueStatus: {$ref: '#/components/schemas/ValueStatus'}
        origin:
          oneOf:
            - $ref: '#/components/schemas/Origin'
            - type: 'null'
        coverage: {$ref: '#/components/schemas/Coverage'}
        minCellValue:
          description: Minimum value among AVAILABLE cells; null when none are available.
          type: [number, 'null']
          minimum: 0
        maxCellValue:
          description: Maximum value among AVAILABLE cells; null when none are available.
          type: [number, 'null']
          minimum: 0
    SourceComposition:
      type: object
      additionalProperties: false
      required:
        - sourceCode
        - source
        - origin
        - cellCount
        - contributingCellDayCount
        - harmonizedValue
        - inputObservationCount
        - sourceInputValidCellCount
      properties:
        sourceCode: {type: integer, minimum: 1, maximum: 4}
        source: {$ref: '#/components/schemas/Source'}
        origin:
          type: string
          enum: [DIRECT_OBSERVATION, SCALED_OBSERVATION, MODEL_REDISTRIBUTED]
        cellCount:
          type: integer
          minimum: 1
          maximum: 587
          description: Distinct selected cells using this source at least once in the period.
        contributingCellDayCount:
          type: integer
          minimum: 1
          description: Number of cell-day contributions using this source.
        harmonizedValue: {type: number, minimum: 0}
        inputObservationCount: {type: integer, minimum: 0}
        sourceInputValidCellCount: {type: integer, minimum: 0}
    Area:
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type: {$ref: '#/components/schemas/AreaType'}
        id: {type: string}
        name:
          type: string
          description: >-
            Vietnamese display name for national and diagnostic-region areas;
            cell IDs remain the stable identifier for cells.
        diagnosticRegion: {type: string}
        cellCount: {type: integer, minimum: 1}
        center: {$ref: '#/components/schemas/Coordinates'}
        bounds: {$ref: '#/components/schemas/Bounds'}
    AreaListResponse:
      type: object
      additionalProperties: false
      required: [items, meta]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Area'}
        meta: {$ref: '#/components/schemas/ResponseMeta'}
    MetadataResponse:
      type: object
      additionalProperties: false
      required: [meta, dateRange, yearRange, gridDegrees, supportedGranularities, capabilities, sourceCodes, limitations, warningCatalog, daily]
      properties:
        meta: {$ref: '#/components/schemas/ResponseMeta'}
        dateRange:
          type: object
          additionalProperties: false
          required: [start, end]
          properties:
            start: {type: string, format: date}
            end: {type: string, format: date}
        yearRange:
          type: object
          additionalProperties: false
          required: [start, end]
          properties:
            start: {type: integer, const: 2000}
            end: {type: integer, const: 2026}
        gridDegrees: {type: number, const: 0.25}
        supportedGranularities:
          type: object
          additionalProperties: false
          required: [calendar, map, trends, seasonality]
          properties:
            calendar:
              type: array
              items: {type: string, enum: [month, pentad]}
            map:
              type: array
              items: {type: string, enum: [day, year, month, pentad]}
            trends:
              type: array
              items: {type: string, enum: [year, month, pentad]}
            seasonality:
              type: array
              items: {type: string, enum: [month, pentad]}
        capabilities:
          type: object
          additionalProperties: false
          required: [spatialSelectors, mapGranularities, calendarDaysAvailable, rawDetectionPointsAvailable, harmonizationComparisonAvailable, anomalyAvailable]
          properties:
            spatialSelectors:
              type: array
              items: {$ref: '#/components/schemas/SelectionType'}
            mapGranularities:
              type: array
              items: {type: string, enum: [day, year, month, pentad]}
            calendarDaysAvailable: {type: boolean, const: true}
            rawDetectionPointsAvailable: {type: boolean, const: false}
            harmonizationComparisonAvailable: {type: boolean}
            anomalyAvailable: {type: boolean, const: false}
        sourceCodes:
          type: array
          items:
            type: object
            required: [code, source, origin]
            properties:
              code: {type: integer, minimum: 1, maximum: 4}
              source: {$ref: '#/components/schemas/Source'}
              origin: {$ref: '#/components/schemas/Origin'}
              description: {type: string}
        limitations:
          type: array
          items: {type: string}
        warningCatalog:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [code, message]
            properties:
              code: {type: string}
              message: {type: string}
              appliesTo:
                type: array
                items: {type: string}
        daily:
          type: object
          additionalProperties: false
          required: [available, uncertaintyIntervalAvailable, qualification]
          properties:
            available: {type: boolean, const: true}
            uncertaintyIntervalAvailable: {type: boolean, const: false}
            qualification: {type: string}
    CalendarValue:
      type: object
      additionalProperties: false
      required: [period, startDate, endDate, value, valueStatus, partial, origin, coverage]
      properties:
        period: {type: integer, minimum: 1, maximum: 73}
        startDate: {type: string, format: date}
        endDate: {type: string, format: date}
        value: {type: [number, 'null'], minimum: 0}
        valueStatus: {$ref: '#/components/schemas/ValueStatus'}
        partial: {type: boolean}
        origin:
          oneOf:
            - $ref: '#/components/schemas/Origin'
            - type: 'null'
        coverage: {$ref: '#/components/schemas/Coverage'}
    BaselineValue:
      type: object
      additionalProperties: false
      required: [period, value, sampleSize, valueStatus]
      properties:
        period: {type: integer, minimum: 1, maximum: 73}
        value: {type: [number, 'null']}
        sampleSize: {type: integer, minimum: 0}
        valueStatus: {$ref: '#/components/schemas/ValueStatus'}
    Baseline:
      type: object
      additionalProperties: false
      required: [method, referenceStartYear, referenceEndYear, excludesTargetYear, values]
      properties:
        method: {type: string, const: median}
        referenceStartYear: {type: integer}
        referenceEndYear: {type: integer}
        excludesTargetYear:
          type: boolean
          description: >-
            True when the target year falls inside the reference range; that
            year is always excluded to avoid self-comparison.
        values:
          type: array
          items: {$ref: '#/components/schemas/BaselineValue'}
    CalendarResponse:
      type: object
      additionalProperties: false
      required: [selection, year, granularity, values, summary, meta]
      properties:
        selection: {$ref: '#/components/schemas/SpatialSelection'}
        year: {type: integer}
        granularity: {$ref: '#/components/schemas/CalendarGranularity'}
        values:
          type: array
          items: {$ref: '#/components/schemas/CalendarValue'}
        summary: {$ref: '#/components/schemas/CalendarSummary'}
        baseline: {$ref: '#/components/schemas/Baseline'}
        meta: {$ref: '#/components/schemas/ResponseMeta'}
    DailyCalendarValue:
      type: object
      additionalProperties: false
      required: [date, value, valueStatus, partial, origin]
      properties:
        date: {type: string, format: date}
        value: {type: [number, 'null'], minimum: 0}
        valueStatus: {$ref: '#/components/schemas/ValueStatus'}
        partial: {type: boolean}
        origin:
          oneOf:
            - $ref: '#/components/schemas/Origin'
            - type: 'null'
        warnings:
          type: array
          items: {type: string}
    DailyCalendarResponse:
      type: object
      additionalProperties: false
      required: [selection, year, month, values, summary, meta]
      properties:
        selection: {$ref: '#/components/schemas/SpatialSelection'}
        year: {type: integer}
        month: {type: integer, minimum: 1, maximum: 12}
        values:
          type: array
          minItems: 28
          maxItems: 31
          items: {$ref: '#/components/schemas/DailyCalendarValue'}
        summary: {$ref: '#/components/schemas/DailyCalendarSummary'}
        meta: {$ref: '#/components/schemas/ResponseMeta'}
    MapCellValue:
      type: object
      additionalProperties: false
      required: [cellId, center, bounds, value, valueStatus, partial, origin]
      properties:
        cellId: {type: string}
        center: {$ref: '#/components/schemas/Coordinates'}
        bounds: {$ref: '#/components/schemas/Bounds'}
        value: {type: [number, 'null'], minimum: 0}
        valueStatus: {$ref: '#/components/schemas/ValueStatus'}
        partial: {type: boolean}
        origin:
          oneOf:
            - $ref: '#/components/schemas/Origin'
            - type: 'null'
        sourceCode: {type: integer, minimum: 1, maximum: 4}
        source: {$ref: '#/components/schemas/Source'}
        inputObservationCount: {type: integer, minimum: 0}
        sourceInputValid: {type: boolean}
    MapCellsResponse:
      type: object
      additionalProperties: false
      required: [selection, temporalSelector, summary, cells, meta]
      properties:
        selection: {$ref: '#/components/schemas/SpatialSelection'}
        temporalSelector: {$ref: '#/components/schemas/TemporalSelector'}
        summary: {$ref: '#/components/schemas/MapSummary'}
        cells:
          type: array
          items: {$ref: '#/components/schemas/MapCellValue'}
        meta: {$ref: '#/components/schemas/ResponseMeta'}
    DailyResponse:
      type: object
      additionalProperties: false
      required:
        - selection
        - date
        - value
        - valueStatus
        - origin
        - partial
        - sourceComposition
        - meta
      properties:
        selection: {$ref: '#/components/schemas/SpatialSelection'}
        area: {$ref: '#/components/schemas/AreaRef'}
        date: {type: string, format: date}
        value: {type: number, minimum: 0}
        valueStatus: {type: string, const: AVAILABLE}
        origin: {$ref: '#/components/schemas/Origin'}
        partial: {type: boolean, const: false}
        sourceComposition:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/SourceComposition'}
        cells:
          type: array
          items: {$ref: '#/components/schemas/MapCellValue'}
        meta: {$ref: '#/components/schemas/ResponseMeta'}
    TrendPoint:
      type: object
      additionalProperties: false
      required: [year, value, valueStatus, partial, origin, coverage]
      properties:
        year: {type: integer}
        period: {type: integer, minimum: 1, maximum: 73}
        value: {type: [number, 'null'], minimum: 0}
        valueStatus: {$ref: '#/components/schemas/ValueStatus'}
        partial: {type: boolean}
        origin:
          oneOf:
            - $ref: '#/components/schemas/Origin'
            - type: 'null'
        coverage: {$ref: '#/components/schemas/Coverage'}
    TrendsResponse:
      type: object
      additionalProperties: false
      required: [selection, granularity, points, meta]
      properties:
        selection: {$ref: '#/components/schemas/SpatialSelection'}
        granularity: {type: string, enum: [year, month, pentad]}
        period: {type: integer, minimum: 1, maximum: 73}
        points:
          type: array
          items: {$ref: '#/components/schemas/TrendPoint'}
        meta: {$ref: '#/components/schemas/ResponseMeta'}
    SeasonalityPeriod:
      type: object
      additionalProperties: false
      required: [period, sampleSize, mean, median, valueStatus]
      properties:
        period: {type: integer, minimum: 1, maximum: 73}
        sampleSize: {type: integer, minimum: 0}
        mean: {type: [number, 'null']}
        median: {type: [number, 'null']}
        valueStatus: {$ref: '#/components/schemas/ValueStatus'}
    SeasonalityResponse:
      type: object
      additionalProperties: false
      required:
        - selection
        - granularity
        - referenceStartYear
        - referenceEndYear
        - minimumSampleSize
        - periods
        - meta
      properties:
        selection: {$ref: '#/components/schemas/SpatialSelection'}
        granularity: {$ref: '#/components/schemas/CalendarGranularity'}
        referenceStartYear: {type: integer}
        referenceEndYear: {type: integer}
        minimumSampleSize: {type: integer, const: 5}
        periods:
          type: array
          items: {$ref: '#/components/schemas/SeasonalityPeriod'}
        meta: {$ref: '#/components/schemas/ResponseMeta'}
    CellPeriodDetailsResponse:
      type: object
      additionalProperties: false
      required:
        - cell
        - temporalSelector
        - value
        - valueStatus
        - origin
        - sourceComposition
        - meta
      properties:
        cell: {$ref: '#/components/schemas/Area'}
        temporalSelector: {$ref: '#/components/schemas/TemporalSelector'}
        value: {type: [number, 'null'], minimum: 0}
        valueStatus: {$ref: '#/components/schemas/ValueStatus'}
        origin:
          oneOf:
            - $ref: '#/components/schemas/Origin'
            - type: 'null'
        sourceComposition:
          type: array
          items: {$ref: '#/components/schemas/SourceComposition'}
        meta: {$ref: '#/components/schemas/ResponseMeta'}
    ComparisonPoint:
      type: object
      required: [year, value]
      properties:
        year: {type: integer}
        value: {type: [number, 'null']}
    ComparisonSeries:
      type: object
      required: [seriesType, label, metric, unit, points]
      properties:
        seriesType:
          type: string
          enum: [RAW_MODIS, RAW_VIIRS_SNPP, RAW_MERGED_REFERENCE, HARMONIZED]
        label: {type: string}
        metric: {type: string}
        unit: {type: string}
        points:
          type: array
          items: {$ref: '#/components/schemas/ComparisonPoint'}
    HarmonizationComparisonResponse:
      type: object
      required: [series, explanationKeys, meta]
      properties:
        series:
          type: array
          items: {$ref: '#/components/schemas/ComparisonSeries'}
        explanationKeys:
          type: array
          items: {type: string}
        meta: {$ref: '#/components/schemas/ResponseMeta'}
    FieldError:
      type: object
      additionalProperties: false
      required: [field, message]
      properties:
        field: {type: string}
        rejectedValue: {}
        message: {type: string}
    Problem:
      type: object
      additionalProperties: true
      required: [type, title, status, code, detail, instance, timestamp]
      properties:
        type: {type: string, format: uri}
        title: {type: string}
        status: {type: integer, minimum: 400, maximum: 599}
        code:
          type: string
          enum:
            - INVALID_PARAMETER
            - INVALID_SPATIAL_SELECTOR
            - INVALID_TEMPORAL_SELECTOR
            - INVALID_BOUNDS
            - AREA_NOT_FOUND
            - CELL_NOT_FOUND
            - NO_CELLS_IN_BOUNDS
            - UNSUPPORTED_QUERY
            - DATE_OUTSIDE_DATASET_RANGE
            - DATASET_UNAVAILABLE
            - INTERNAL_ERROR
        detail: {type: string}
        instance: {type: string}
        errors:
          type: array
          items: {$ref: '#/components/schemas/FieldError'}
        timestamp: {type: string, format: date-time}
