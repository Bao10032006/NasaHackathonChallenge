spring.application.name=backend

# Render and other PaaS providers inject the public HTTP port at runtime.
# Local development continues to use port 8080 when PORT is not set.
server.port=${PORT:8080}

# Relative to the backend working directory by default. Override in deployed
# environments with HOALICH_DATASET_ROOT. Startup validates the manifest,
# checksums, dimensions and binary content before exposing repository beans.
hoalich.dataset.root=${HOALICH_DATASET_ROOT:hoalich_data_v1/hoalich_data_v1}

# Frontend normally proxies /api during development. Direct cross-origin access
# uses an explicit allow-list; provide multiple origins as a comma-separated value.
hoalich.web.allowed-origins=${HOALICH_ALLOWED_ORIGINS:http://localhost:5173}
