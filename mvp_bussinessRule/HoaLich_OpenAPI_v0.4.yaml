openapi: 3.1.0
info:
  title: Hoa Lich Read-only API
  version: 0.4.0-proposed
  license:
    name: Project repository terms
    identifier: LicenseRef-Project-Repository-Terms
  description: >-
    Frontend-aligned proposal built on v0.3 and Artifact Spec 1.0.0.
    Values use harmonized snpp_eq and are not fire-event counts, burned area,
    forecasts, or real-time alerts. v0.4 is not the backend implementation
    baseline until Backend and Frontend approve it. Requests remain compatible
    where semantics match; response envelopes are a controlled revision of the
    v0.3 draft and are not described as fully additive.
servers:
  - url: /api/v1
security: []
tags:
  - name: Metadata
    description: Active snapshot capabilities, sources, versions, and limitations.
  - name: Areas
    description: Named national, diagnostic-region, and grid-cell metadata.
  - name: Activity
    description: Calendar, map, daily, trends, and seasonality queries.
  - name: Cells
    description: On-demand grid-cell metadata and period provenance.
  - name: Methodology
    description: Optional methodology evidence outside the core demo flow.
paths:
  /metadata:
    get:
      tags: [Metadata]
      operationId: getMetadata
      summary: Get dataset capabilities, ranges, sources, and limitations
      responses:
        '200':
          description: Active immutable snapshot metadata
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MetadataResponse'}
              examples:
                activeSnapshot: {$ref: '#/components/examples/GoldenMetadata'}
        '503': {$ref: '#/components/responses/DatasetUnavailable'}
        '500': {$ref: '#/components/responses/InternalError'}
  /areas:
    get:
      tags: [Areas]
      operationId: listAreas
      summary: List named national, diagnostic-region, and cell areas
      parameters:
        - name: type
          in: query
          required: false
          schema: {$ref: '#/components/schemas/AreaType'}
      responses:
        '200':
          description: Supported named areas
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AreaListResponse'}
              examples:
                namedAreas: {$ref: '#/components/examples/GoldenNamedAreas'}
        '400': {$ref: '#/components/responses/InvalidParameter'}
        '503': {$ref: '#/components/responses/DatasetUnavailable'}
        '500': {$ref: '#/components/responses/InternalError'}
  /calendar:
    get:
      tags: [Activity]
      operationId: getCalendar
      summary: Get 12 monthly or 73 pentad values for one year
      description: >-
        Supply exactly one spatial selector: areaType+areaId or all four bbox
        coordinates. Named area and bbox are mutually exclusive. A bbox is
        evaluated against all 587 cells and may cross diagnostic regions.
      parameters:
        - $ref: '#/components/parameters/AreaType'
        - $ref: '#/components/parameters/AreaId'
        - $ref: '#/components/parameters/West'
        - $ref: '#/components/parameters/South'
        - $ref: '#/components/parameters/East'
        - $ref: '#/components/parameters/North'
        - $ref: '#/components/parameters/YearRequired'
        - name: granularity
          in: query
          required: true
          schema: {$ref: '#/components/schemas/CalendarGranularity'}
        - name: includeBaseline
          in: query
          required: false
          schema: {type: boolean, default: false}
        - name: baselineStartYear
          in: query
          required: false
          schema: {type: integer, minimum: 2000, maximum: 2026, default: 2003}
        - name: baselineEndYear
          in: query
          required: false
          schema: {type: integer, minimum: 2000, maximum: 2026, default: 2025}
      responses:
        '200':
          description: Calendar, coverage, summary, and spatial selection
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CalendarResponse'}
              examples:
                golden2024: {$ref: '#/components/examples/GoldenCalendar2024'}
        '400': {$ref: '#/components/responses/InvalidParameter'}
        '404': {$ref: '#/components/responses/AreaNotFound'}
        '422': {$ref: '#/components/responses/UnsupportedQuery'}
        '503': {$ref: '#/components/responses/DatasetUnavailable'}
        '500': {$ref: '#/components/responses/InternalError'}
  /calendar/days:
    get:
      tags: [Activity]
      operationId: getDailyCalendar
      summary: Get every civil day of one month in a single response
      description: >-
        Returns 28-31 items. Days outside the dataset remain present with
        value=null and valueStatus=OUTSIDE_DATASET_RANGE.
      parameters:
        - $ref: '#/components/parameters/AreaType'
        - $ref: '#/components/parameters/AreaId'
        - $ref: '#/components/parameters/West'
        - $ref: '#/components/parameters/South'
        - $ref: '#/components/parameters/East'
        - $ref: '#/components/parameters/North'
        - $ref: '#/components/parameters/YearRequired'
        - name: month
          in: query
          required: true
          schema: {type: integer, minimum: 1, maximum: 12}
      responses:
        '200':
          description: Daily calendar with month summary and coverage
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DailyCalendarResponse'}
              examples:
                goldenMarch2024: {$ref: '#/components/examples/GoldenDailyCalendarMarch2024'}
                allZeroPeakNull: {$ref: '#/components/examples/SyntheticAllZeroDailyCalendar'}
        '400': {$ref: '#/components/responses/InvalidParameter'}
        '404': {$ref: '#/components/responses/AreaNotFound'}
        '422': {$ref: '#/components/responses/UnsupportedQuery'}
        '503': {$ref: '#/components/responses/DatasetUnavailable'}
        '500': {$ref: '#/components/responses/InternalError'}
  /map/cells:
    get:
      tags: [Activity]
      operationId: getMapCells
      summary: Get grid-cell values for exactly one date, year, month, or pentad
      description: >-
        Temporal selector must be exactly one of: date; year only; year+month;
        year+pentad. Spatial selector is one named area or one complete bbox.
        For v0.3 compatibility only, omitting spatial parameters means national.
      parameters:
        - $ref: '#/components/parameters/AreaType'
        - $ref: '#/components/parameters/AreaId'
        - $ref: '#/components/parameters/West'
        - $ref: '#/components/parameters/South'
        - $ref: '#/components/parameters/East'
        - $ref: '#/components/parameters/North'
        - name: date
          in: query
          required: false
          schema: {type: string, format: date}
        - $ref: '#/components/parameters/YearOptional'
        - name: month
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 12}
        - name: pentad
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 73}
      responses:
        '200':
          description: Ordered cell slice with selection and temporal coverage
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MapCellsResponse'}
              examples:
                goldenExactDate: {$ref: '#/components/examples/GoldenMapExactDate'}
        '400': {$ref: '#/components/responses/InvalidParameter'}
        '404': {$ref: '#/components/responses/AreaNotFound'}
        '422': {$ref: '#/components/responses/UnsupportedQuery'}
        '503': {$ref: '#/components/responses/DatasetUnavailable'}
        '500': {$ref: '#/components/responses/InternalError'}
  /daily:
    get:
      tags: [Activity]
      operationId: getDailyActivity
      summary: Get harmonized activity for one exact date and spatial selection
      parameters:
        - name: date
          in: query
          required: true
          schema: {type: string, format: date}
        - $ref: '#/components/parameters/AreaType'
        - $ref: '#/components/parameters/AreaId'
        - $ref: '#/components/parameters/West'
        - $ref: '#/components/parameters/South'
        - $ref: '#/components/parameters/East'
        - $ref: '#/components/parameters/North'
        - name: includeCells
          in: query
          required: false
          schema: {type: boolean, default: false}
      responses:
        '200':
          description: Daily aggregate and source composition
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DailyResponse'}
        '400': {$ref: '#/components/responses/InvalidParameter'}
        '404': {$ref: '#/components/responses/AreaNotFound'}
        '422': {$ref: '#/components/responses/UnsupportedQuery'}
        '503': {$ref: '#/components/responses/DatasetUnavailable'}
        '500': {$ref: '#/components/responses/InternalError'}
  /trends:
    get:
      tags: [Activity]
      operationId: getTrends
      summary: Get comparable yearly or same-period historical values
      parameters:
        - $ref: '#/components/parameters/AreaType'
        - $ref: '#/components/parameters/AreaId'
        - $ref: '#/components/parameters/West'
        - $ref: '#/components/parameters/South'
        - $ref: '#/components/parameters/East'
        - $ref: '#/components/parameters/North'
        - name: startYear
          in: query
          required: true
          schema: {type: integer, minimum: 2000, maximum: 2026}
        - name: endYear
          in: query
          required: true
          schema: {type: integer, minimum: 2000, maximum: 2026}
        - name: granularity
          in: query
          required: true
          schema: {type: string, enum: [year, month, pentad]}
        - name: period
          in: query
          required: false
          description: Forbidden for year; required for month or pentad.
          schema: {type: integer, minimum: 1, maximum: 73}
      responses:
        '200':
          description: Historical points for the resolved selection
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TrendsResponse'}
        '400': {$ref: '#/components/responses/InvalidParameter'}
        '404': {$ref: '#/components/responses/AreaNotFound'}
        '422': {$ref: '#/components/responses/UnsupportedQuery'}
        '503': {$ref: '#/components/responses/DatasetUnavailable'}
        '500': {$ref: '#/components/responses/InternalError'}
  /seasonality:
    get:
      tags: [Activity]
      operationId: getSeasonality
      summary: Get historical month or pentad seasonal statistics
      parameters:
        - $ref: '#/components/parameters/AreaType'
        - $ref: '#/components/parameters/AreaId'
        - $ref: '#/components/parameters/West'
        - $ref: '#/components/parameters/South'
        - $ref: '#/components/parameters/East'
        - $ref: '#/components/parameters/North'
        - name: granularity
          in: query
          required: true
          schema: {$ref: '#/components/schemas/CalendarGranularity'}
        - name: startYear
          in: query
          required: false
          schema: {type: integer, minimum: 2000, maximum: 2026, default: 2003}
        - name: endYear
          in: query
          required: false
          schema: {type: integer, minimum: 2000, maximum: 2026, default: 2025}
      responses:
        '200':
          description: Seasonal statistics by comparable period
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SeasonalityResponse'}
        '400': {$ref: '#/components/responses/InvalidParameter'}
        '404': {$ref: '#/components/responses/AreaNotFound'}
        '422': {$ref: '#/components/responses/UnsupportedQuery'}
        '503': {$ref: '#/components/responses/DatasetUnavailable'}
        '500': {$ref: '#/components/responses/InternalError'}
  /cells/{cellId}/period-details:
    get:
      tags: [Cells]
      operationId: getCellPeriodDetails
      summary: Get on-demand provenance for one cell and temporal selector
      description: >-
        Temporal selector follows /map/cells. This endpoint does not return raw
        detection coordinates or timestamps.
      parameters:
        - name: cellId
          in: path
          required: true
          schema: {type: string, pattern: '^[0-9]+_[0-9]+$'}
        - name: date
          in: query
          required: false
          schema: {type: string, format: date}
        - $ref: '#/components/parameters/YearOptional'
        - name: month
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 12}
        - name: pentad
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 73}
      responses:
        '200':
          description: Cell value, coverage, origin, and source composition
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CellPeriodDetailsResponse'}
        '400': {$ref: '#/components/responses/InvalidParameter'}
        '404': {$ref: '#/components/responses/CellNotFound'}
        '422': {$ref: '#/components/responses/UnsupportedQuery'}
        '503': {$ref: '#/components/responses/DatasetUnavailable'}
        '500': {$ref: '#/components/responses/InternalError'}
  /harmonization/comparison:
    get:
      tags: [Methodology]
      operationId: getHarmonizationComparison
      summary: Get optional verified raw-versus-harmonized national series
      description: Optional in v0.4; not required for the core demo Definition of Done.
      x-feature-status: optional
      parameters:
        - name: startYear
          in: query
          required: false
          schema: {type: integer, minimum: 2000, maximum: 2026}
        - name: endYear
          in: query
          required: false
          schema: {type: integer, minimum: 2000, maximum: 2026}
      responses:
        '200':
          description: Separately labelled raw and harmonized series
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HarmonizationComparisonResponse'}
        '400': {$ref: '#/components/responses/InvalidParameter'}
        '422': {$ref: '#/components/responses/UnsupportedQuery'}
        '503': {$ref: '#/components/responses/DatasetUnavailable'}
        '500': {$ref: '#/components/responses/InternalError'}
components:
  parameters:
    AreaType:
      name: areaType
      in: query
      required: false
      schema: {$ref: '#/components/schemas/AreaType'}
    AreaId:
      name: areaId
      in: query
      required: false
      schema: {type: string, minLength: 1}
    West:
      name: west
      in: query
      required: false
      schema: {type: number, format: double, minimum: -180, maximum: 180}
    South:
      name: south
      in: query
      required: false
      schema: {type: number, format: double, minimum: -90, maximum: 90}
    East:
      name: east
      in: query
      required: false
      schema: {type: number, format: double, minimum: -180, maximum: 180}
    North:
      name: north
      in: query
      required: false
      schema: {type: number, format: double, minimum: -90, maximum: 90}
    YearRequired:
      name: year
      in: query
      required: true
      schema: {type: integer, minimum: 2000, maximum: 2026}
    YearOptional:
      name: year
      in: query
      required: false
      schema: {type: integer, minimum: 2000, maximum: 2026}
  examples:
    GoldenMetadata:
      summary: Active snapshot metadata and frontend capability catalog
      value:
        meta: &goldenMeta
          dataVersion: hoalich-data-v1-2026-11-13
          modelVersion: lai-clim-s2-k60-kappa3
          dataThrough: '2026-11-13'
          metric: snpp_eq
          unit: S-NPP-equivalent daytime detections
          timeZone: UTC
          warnings: []
        dateRange: {start: '2000-11-01', end: '2026-11-13'}
        yearRange: {start: 2000, end: 2026}
        gridDegrees: 0.25
        supportedGranularities:
          calendar: [month, pentad]
          map: [day, year, month, pentad]
          trends: [year, month, pentad]
          seasonality: [month, pentad]
        capabilities:
          spatialSelectors: [NAMED_AREA, BOUNDING_BOX]
          mapGranularities: [day, year, month, pentad]
          calendarDaysAvailable: true
          rawDetectionPointsAvailable: false
          harmonizationComparisonAvailable: true
          anomalyAvailable: false
        sourceCodes:
          - {code: 1, source: TERRA, origin: MODEL_REDISTRIBUTED, description: Terra monthly estimate redistributed to days}
          - {code: 2, source: AQUA, origin: MODEL_REDISTRIBUTED, description: Calibrated Aqua monthly estimate redistributed to days}
          - {code: 3, source: SNPP, origin: DIRECT_OBSERVATION, description: Direct S-NPP daytime detections}
          - {code: 4, source: NOAA20, origin: SCALED_OBSERVATION, description: NOAA-20 detections scaled to S-NPP equivalent}
        limitations:
          - snpp_eq is not a fire-event count or burned area.
          - Daily uncertainty intervals are unavailable.
        warningCatalog:
          - {code: PARTIAL_PERIOD, message: Kỳ được hỏi chưa đủ ngày trong dataset., appliesTo: [/calendar, /trends, /map/cells]}
          - {code: MODEL_REDISTRIBUTED_DAILY_VALUE, message: Giá trị ngày là ước lượng cấp tháng được phân bổ xuống ngày., appliesTo: [/daily, /map/cells]}
          - {code: NO_DAILY_UNCERTAINTY_INTERVAL, message: Không có khoảng bất định cấp ngày., appliesTo: [/daily, /map/cells]}
        daily:
          available: true
          uncertaintyIntervalAvailable: false
          qualification: Daily values are verified for use with published scientific limitations.
    GoldenNamedAreas:
      summary: Vietnamese display names for national and diagnostic regions
      value:
        items:
          - {type: national, id: ToanQuoc, name: Toàn quốc, cellCount: 587}
          - {type: diagnostic_region, id: DBSCL, name: Đồng bằng sông Cửu Long, cellCount: 71}
          - {type: diagnostic_region, id: DBSH, name: Đồng bằng sông Hồng, cellCount: 33}
          - {type: diagnostic_region, id: Khac, name: Khu vực khác, cellCount: 262}
          - {type: diagnostic_region, id: TayBac, name: Tây Bắc, cellCount: 99}
          - {type: diagnostic_region, id: TayNguyen, name: Tây Nguyên, cellCount: 122}
